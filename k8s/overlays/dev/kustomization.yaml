apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: petclinic-dev

resources:
  - ../../base

# PETPLAT-45: dev overlay — all services at 1 replica (explicit, even though
# it matches the base default, so dev intent is self-documenting here).
replicas:
  - name: config-server
    count: 1
  - name: discovery-server
    count: 1
  - name: api-gateway
    count: 1
  - name: customers-service
    count: 1
  - name: visits-service
    count: 1
  - name: vets-service
    count: 1
  - name: genai-service
    count: 1
  - name: admin-server
    count: 1

# Rewrites the base placeholder image references to the dev ECR repos.
# ${AWS_ACCOUNT_ID} and ${IMAGE_TAG} are envsubst placeholders — render with
# `kubectl kustomize k8s/overlays/dev | envsubst | kubectl apply -f -`
# (same pattern as k8s/base/ingress and k8s/base/external-secrets).
images:
  - name: petclinic/config-server
    newName: ${AWS_ACCOUNT_ID}.dkr.ecr.eu-central-1.amazonaws.com/petclinic-dev/config-server
    newTag: ${IMAGE_TAG}
  - name: petclinic/discovery-server
    newName: ${AWS_ACCOUNT_ID}.dkr.ecr.eu-central-1.amazonaws.com/petclinic-dev/discovery-server
    newTag: ${IMAGE_TAG}
  - name: petclinic/api-gateway
    newName: ${AWS_ACCOUNT_ID}.dkr.ecr.eu-central-1.amazonaws.com/petclinic-dev/api-gateway
    newTag: ${IMAGE_TAG}
  - name: petclinic/customers-service
    newName: ${AWS_ACCOUNT_ID}.dkr.ecr.eu-central-1.amazonaws.com/petclinic-dev/customers-service
    newTag: ${IMAGE_TAG}
  - name: petclinic/visits-service
    newName: ${AWS_ACCOUNT_ID}.dkr.ecr.eu-central-1.amazonaws.com/petclinic-dev/visits-service
    newTag: ${IMAGE_TAG}
  - name: petclinic/vets-service
    newName: ${AWS_ACCOUNT_ID}.dkr.ecr.eu-central-1.amazonaws.com/petclinic-dev/vets-service
    newTag: ${IMAGE_TAG}
  - name: petclinic/genai-service
    newName: ${AWS_ACCOUNT_ID}.dkr.ecr.eu-central-1.amazonaws.com/petclinic-dev/genai-service
    newTag: ${IMAGE_TAG}
  - name: petclinic/admin-server
    newName: ${AWS_ACCOUNT_ID}.dkr.ecr.eu-central-1.amazonaws.com/petclinic-dev/admin-server
    newTag: ${IMAGE_TAG}
