# Syncs RDS master credentials from Secrets Manager into the app namespace
# (PETPLAT-35). ${PETCLINIC_NAMESPACE} and ${ENVIRONMENT} are envsubst
# placeholders — see README.md in this directory.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rds-credentials
  namespace: ${PETCLINIC_NAMESPACE}
  labels:
    app.kubernetes.io/name: rds-credentials
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: infrastructure
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: rds-credentials
  data:
    - secretKey: username
      remoteRef:
        key: petclinic/${ENVIRONMENT}/rds-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: petclinic/${ENVIRONMENT}/rds-credentials
        property: password
